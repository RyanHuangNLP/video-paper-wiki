        schema, public surface and failure order. It changes only the two
        adversarial prepare fixtures so a distinct replacement inode exists
        while the original inode remains live, eliminating the Linux inode
        reuse assumption without weakening WORK_PATH_UNSAFE or publication checks.
      scope:
        - Persist one canonical staged PDF request with exact approval-ref, plan and payload bindings.
        - Publish prepared blob first and request last in one retained batch lineage.
        - Inspect the fixed prepared request through a retained work/batch session.
        - Enumerate and revalidate the complete no-follow captured sibling snapshot.
        - Return a closed reuse noop or create authority bound to accepted staging and pinned inspect.
        - Share one pure compact transaction-bundle encoder without changing accepted bytes or error order.
        - Expose the frozen agent-safe capture inspect CLI with zero egress and no apply authority.
      out_of_scope:
        - Staged code capture, manual capture semantic changes or arbitrary prepared paths.
        - Transaction apply/recover/admin, runtime results, Vault mutation or real authorization issuance.
        - Ledger merge, managed-prefix audit, integrity-runtime, mapper/compiler, BM25/index or retrieval.
        - Dependencies, vendor, workflow, catalog, PR state, merge or human-gate changes.
      generation_decision: >-
        Base generation revision 1 remains unchanged because this request and
        read-only authority emit no catalog rows. Any later authority consumer
