# Video Paper Wiki taxonomy v1: canonical terms are review-controlled.
version: v1
policy:
  unknown_terms: review_queue
  silent_create: false
  statement_en: "Unknown terms MUST enter a review queue and MUST NOT be silently created as canonical terms."
  statement_zh: "未知术语必须进入 review queue，不得静默创建新的 canonical term。"
axes:
  - slug: task/conditioning
    label_zh: 任务与条件
    label_en: Task and conditioning
    aliases: [task]
    terms:
      - {slug: text-to-video, label_zh: 文生视频, aliases: [t2v], status: canonical}
      - {slug: image-to-video, label_zh: 图生视频, aliases: [i2v], status: canonical}
  - slug: formulation/objective
    label_zh: 建模与目标
    label_en: Formulation and objective
    aliases: [objective]
    terms:
      - {slug: diffusion, label_zh: 扩散, aliases: [diffusion model], status: canonical}
      - {slug: flow-matching, label_zh: 流匹配, aliases: [flow matching], status: canonical}
  - slug: representation/tokenizer
    label_zh: 表示与分词器
    label_en: Representation and tokenizer
    aliases: [tokenizer]
    terms:
      - {slug: discrete-tokenizer, label_zh: 离散分词器, aliases: [discrete tokenizer], status: canonical}
      - {slug: 3d-vae, label_zh: 三维变分自编码器, aliases: [3D VAE], status: canonical}
  - slug: backbone
    label_zh: 主干网络
    label_en: Backbone
    aliases: [architecture]
    terms:
      - {slug: dit, label_zh: 扩散 Transformer, aliases: [DiT], status: canonical}
      - {slug: unet, label_zh: U 型网络, aliases: [U-Net], status: canonical}
  - slug: spatial-temporal-modeling
    label_zh: 时空建模
    label_en: Spatial-temporal modeling
    aliases: [spatiotemporal modeling]
    terms:
      - {slug: space-time-attention, label_zh: 时空注意力, aliases: [space-time], status: canonical}
      - {slug: temporal-convolution, label_zh: 时间卷积, aliases: [temporal conv], status: canonical}
  - slug: data/captioning/filtering
    label_zh: 数据、描述与过滤
    label_en: Data, captioning, and filtering
    aliases: [data curation]
    terms:
      - {slug: captioning, label_zh: 视频描述, aliases: [recaptioning], status: canonical}
      - {slug: filtering, label_zh: 数据过滤, aliases: [data filtering], status: canonical}
  - slug: training/parallelism/optimization
    label_zh: 训练、并行与优化
    label_en: Training, parallelism, and optimization
    aliases: [training]
    terms:
      - {slug: data-parallelism, label_zh: 数据并行, aliases: [data parallel], status: canonical}
      - {slug: mixed-precision, label_zh: 混合精度, aliases: [mixed precision], status: canonical}
  - slug: inference/distillation/acceleration
    label_zh: 推理、蒸馏与加速
    label_en: Inference, distillation, and acceleration
    aliases: [inference acceleration]
    terms:
      - {slug: distillation, label_zh: 蒸馏, aliases: [knowledge distillation], status: canonical}
      - {slug: few-step-sampling, label_zh: 少步采样, aliases: [few-step inference], status: canonical}
  - slug: control
    label_zh: 控制
    label_en: Control
    aliases: [controllability]
    terms:
      - {slug: motion-control, label_zh: 运动控制, aliases: [camera control], status: canonical}
      - {slug: structure-control, label_zh: 结构控制, aliases: [structural control], status: canonical}
  - slug: evaluation/dataset/benchmark
    label_zh: 评测、数据集与基准
    label_en: Evaluation, dataset, and benchmark
    aliases: [evaluation]
    terms:
      - {slug: fvd, label_zh: 弗雷歇视频距离, aliases: [Fréchet Video Distance], status: canonical}
      - {slug: vbench, label_zh: VBench 视频生成基准, aliases: [VBench], status: canonical}
