gate_effect: none
external_provenance_license_gate: EXTERNAL-PROVENANCE-LICENSE-001
gate_status_at_observation: not-recorded
audit_method:
  commit_resolution: exact 40-character lowercase Git object ID
  tree_resolution: git rev-parse AUDITED_COMMIT^{tree}
  integrity_check: git fsck --full --no-progress
  source_hash: SHA-256 over exact regular-file bytes
  retrieval: existing pinned submodule or ephemeral public clone; clones are not retained
  replay: >-
    Fetch the repository URL and exact audited_commit, require the commit and tree
    objects, compare tree_sha1, run the integrity check, then compare every listed
    license and source-file SHA-256. A branch name is context only and is never a pin.
  tools:
    git: git version 2.50.1 (Apple Git-155)
    shasum: "6.02"
copy_policy: >-
  The existing pinned claude-obsidian submodule may continue through its current
  adapter contract. No newly audited external source is copied until the project
  records the external provenance/license decision; W1 uses an independent implementation.

