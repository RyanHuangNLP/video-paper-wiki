[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-paper-wiki-parser-executor"
version = "0.1.0"
description = "Optional offline Docling producer for staged manual-PDF extraction"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
runtime = ["docling==2.117.0"]

[project.scripts]
vpwiki-parser = "video_paper_wiki_parser_executor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/video_paper_wiki_parser_executor"]
