[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-paper-wiki"
version = "0.1.0"
description = "Agent-safe CLI skeleton for Video Paper Wiki (VPKB-000-02)"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
    "pypdf>=5.0",
]

[project.scripts]
vpwiki = "video_paper_wiki.cli:main"

[project.optional-dependencies]
docling = ["docling==2.117.0"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/video_paper_wiki"]

[tool.hatch.build.targets.wheel.force-include]
"docs/seed" = "video_paper_wiki/seed"
"schemas" = "video_paper_wiki/schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
